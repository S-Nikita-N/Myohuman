# Workstation thread count
num_threads: 1

# Policy mode
control_mode: "direct"

# Train-test flags
im_eval: True
test: True

# Rendering flags
headless: False
fast_forward: True

# Motion configs
motion_id: 0
num_motions: 565
random_start: False

# Motion selection flags
random_sample: False
motion_ids_file: null  # path to JSON from mine_negatives.py — loads only these motion IDs

# Policy Observations
proprioceptive_inputs: 
  - root_height
  - root_tilt
  - local_body_pos
  - local_body_rot
  - local_body_vel
  - local_body_ang_vel
  # - muscle_len
  # - muscle_vel
  # - muscle_force
  - feet_contacts

task_inputs: 
  - diff_local_body_pos
  - diff_local_vel
  - local_ref_body_pos
  # - diff_muscle_len
  # - diff_muscle_vel

# File paths
xml_path: "${project_root}/xml/myohuman_v2.xml"
initial_pose_file: "${project_root}/data/inverse_kinematics/ik_test_v2.pkl"

# Extra analysis flags
recording_biomechanics: False
deactivate_muscles: False
