# Workstation thread count
num_threads: 1

# Policy mode
control_mode: "PD"

# Train-test flags
im_eval: False
test: False

# Rendering flags
headless: True
fast_forward: True

# Motion configs
motion_id: 0
num_motions: 1916
random_start: True

# Motion selection flags
random_sample: False

# Policy Observations
proprioceptive_inputs:
  - root_height
  - local_body_pos
  - local_body_rot
  - local_body_vel
  - local_body_ang_vel
  # - muscle_len
  # - muscle_vel
  # - muscle_force
  - feet_contacts

task_inputs: 
  - diff_local_body_pos
  - diff_local_vel
  - local_ref_body_pos
  # - diff_muscle_len
  # - diff_muscle_vel

# File
xml_path: "${project_root}/xml/myohuman.xml"
initial_pose_file: "${project_root}/data/inverse_kinematics/ik_train.pkl"

# Extra analysis flags
recording_biomechanics: False
deactivate_muscles: False
