# Default experiment name
task: MyoLegs Imitation

# Simulation Configs
sim_timestep_inv: 150
control_frequency_inv: 5

# Control Configs
kp_scale: 1.0
kd_scale: 1.0
clip_actions: True
reward_specs:
  "k_pos": 200
  "k_vel": 5
  "k_muscle_len": 2000
  "k_muscle_vel": 20
  
  "w_pos": 0.7
  "w_vel": 0.3
  "w_energy": 0.002
  "w_muscle_len": 0
  "w_muscle_vel": 0

#### Task Configs
resampling_interval: 100
termination_distance: 0.15

# Per-body termination distances (dict: body_name → threshold).
# Bodies not listed use the global termination_distance.
# null = global threshold for all bodies.
# Example: {humerus_r: 0.3, humerus_l: 0.3, radius_r: 0.3, radius_l: 0.3, lunate_r: 0.3, lunate_l: 0.3}
body_termination_distance: null

# Per-body reward weights for tracked bodies (same order as MYOLEG_TRACKED_BODIES).
# null = equal weights (1.0 for all).
body_reward_weights: null
