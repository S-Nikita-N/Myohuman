[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myohuman"
version = "0.1.0"
description = "Your package description"
authors = [{ name = "Me", email = "me@email.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "wandb>=0.22.3,<0.23",
    "sk-video==1.1.10",
    "gymnasium==0.29.1",
    "gym==0.26.2",
    "gym-notices==0.0.8",
    "hydra-core>=1.3.2,<2",
    "mujoco==3.3.6",
    "easydict==1.11",
    "h5py>=3.10,<4",
    "importlib-resources==6.4.5",
    "ipdb==0.13.13",
    "joblib>=1.5.2,<2",
    "matplotlib>=3.10.7,<4",
    "numpy>=2.3.4,<3",
    "numpy-stl>=3.2.0,<4",
    "omegaconf==2.3.0",
    "pandas>=2.3.3,<3",
    "pyopengl==3.1.0",
    "pytest>=8.4.2,<9",
    "scikit-learn>=1.7.2,<2",
    "scipy>=1.16.3,<2",
    "termcolor>=3.2.0,<4",
    "torch>=2.9.0,<3",
    "tqdm>=4.67.1,<5",
    "ipykernel>=7.1.0,<8",
    "smplx",
    "lxml>=6.0.2,<7",
    "httpx>=0.28.1,<0.29",
    "openai>=2.8.1,<3",
    "huggingface-hub>=1.2.3,<2",
]

[tool.uv.sources]
smplx = { git = "https://github.com/ZhengyiLuo/smplx.git", rev = "a5b8e4ac14f79f3f33fd2cf2a16e6f507146b813" }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "pre-commit>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myohuman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tools/pre_commit"]

# Vendored third-party math is excluded from lint/format/style everywhere.
[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = [
    "src/myohuman/poselib",
    "src/myohuman/smpl/smpl_parser.py",
    "src/myohuman/utils/transformation.py",
    "src/myohuman/utils/pytorch3d_transforms.py",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
# scripts pin sys.path / env before importing project modules.
"scripts/*" = ["E402"]

[tool.typos.files]
extend-exclude = [
    "notebooks",
    "src/myohuman/poselib",
    "src/myohuman/smpl/smpl_parser.py",
    "src/myohuman/utils/transformation.py",
    "src/myohuman/utils/pytorch3d_transforms.py",
]

# Domain terms / identifiers that are not typos (renaming would change an API
# or a vendored function name): guassian_filter, fix_continous_dof, GAE, thr.
[tool.typos.default.extend-words]
guassian = "guassian"
continous = "continous"
thr = "thr"
gae = "gae"

# Scoped to the typed tooling for now; annotating the legacy src/ is a
# separate follow-up (hundreds of implicit-Optional / attr-defined findings).
[tool.mypy]
python_version = "3.12"
files = ["tools"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["myohuman", "tools"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
